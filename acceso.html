
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree-bajos - Registro de usuarios</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header class="encabezado">
        <img src="imagenes/logo.png" alt="Logo de Tree-bajos">
        <h1>Tree-bajos</h1>
    </header>

    <main class="contenedor-acceso">

        <!-- LADO IZQUIERDO: INICIAR SESIÓN -->
        <section class="panel">
            <h2>Ya tengo cuenta</h2>
            <p>Ingresa tus datos para acceder.</p>

            <form onsubmit="return continuar(event, 'inicio')">

                <label for="correo-login">Correo electrónico</label>
                <input
                    type="email"
                    id="correo-login"
                    placeholder="Escribe tu correo"
                    required
                >

                <label for="password-login">Contraseña</label>
                <input
                    type="password"
                    id="password-login"
                    placeholder="Escribe tu contraseña"
                    required
                >

                <button type="submit" class="boton">
                    Continuar
                </button>

            </form>
        </section>

        <!-- LADO DERECHO: CREAR CUENTA -->
        <section class="panel">
            <h2>Crear nueva cuenta</h2>
            <p>Completa tus datos para registrarte.</p>

            <form onsubmit="return continuar(event, 'registro')">

                <label for="nombre">Nombre de la cuenta</label>
                <input
                    type="text"
                    id="nombre"
                    placeholder="Escribe tu nombre"
                    required
                >

                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    placeholder="ejemplo@correo.com"
                    required
                >

                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Crea una contraseña"
                    required
                >

                <label for="telefono">Número de teléfono</label>
                <input
                    type="tel"
                    id="telefono"
                    placeholder="Escribe tu teléfono"
                    required
                >

                <label for="direccion">Dirección</label>
                <input
                    type="text"
                    id="direccion"
                    placeholder="Escribe tu dirección"
                    required
                >

                <button type="submit" class="boton">
                    Continuar
                </button>

            </form>
        </section>

    </main>

    <script>
      function continuar(event, tipo) {
    event.preventDefault();

    window.location.href = "inicio.html";

    return false;
}
        
    </script>

</body>
</html>
